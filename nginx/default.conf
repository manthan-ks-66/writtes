upstream server_clusters {
        least_conn;

        server s-one:3000;
        server s-two:3000;
        server s-three:3000;
}

server {
    listen 80;
    server_name writtes.com www.writtes.com api.writtes.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
        listen 443 ssl http2;
        server_name writtes.com;

        # paths to ssl certification
        ssl_certificate /etc/letsencrypt/live/writtes.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/writtes.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
}